default: &default
  adapter: sqlite3
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  timeout: 5000

development:
  primary:
    <<: *default
    database: storage/development_admin.sqlite3
  sandbox:
    <<: *default
    database: storage/development_sandbox.sqlite3
  cache:
    <<: *default
    database: storage/development_cache.sqlite3
  queue:
    <<: *default
    database: storage/development_queue.sqlite3
  cable:
    <<: *default
    database: storage/development_cable.sqlite3

test:
  <<: *default
  database: storage/test.sqlite3

production:
  primary:
    <% if ENV["ADMIN_DATABASE_URL"].present? %>
    adapter: postgresql
    encoding: unicode
    url: <%= ENV["ADMIN_DATABASE_URL"] %>
    connect_timeout: 15
    <% else %>
    <<: *default
    database: <%= File.exist?(Rails.root.join("storage/production.sqlite3")) && !File.exist?(Rails.root.join("storage/production_admin.sqlite3")) ? "storage/production.sqlite3" : "storage/production_admin.sqlite3" %>
    <% end %>
    pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  sandbox:
    <% if ENV["SANDBOX_DATABASE_URL"].present? %>
    adapter: postgresql
    encoding: unicode
    url: <%= ENV["SANDBOX_DATABASE_URL"] %>
    connect_timeout: 15
    <% else %>
    <<: *default
    database: storage/production_sandbox.sqlite3
    <% end %>
    pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  cache:
    <<: *default
    database: storage/production_cache.sqlite3
  queue:
    <<: *default
    database: storage/production_queue.sqlite3
  cable:
    <<: *default
    database: storage/production_cable.sqlite3